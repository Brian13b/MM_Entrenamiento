name: MM Entrenamiento CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configurar .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restaurar, Compilar y Testear Backend
      working-directory: ./backend/MMEntrenamiento
      run: |
        dotnet restore
        dotnet build --no-restore -c Release
        dotnet test --no-build -c Release

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Instalar y Testear Frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run test